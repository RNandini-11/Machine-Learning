name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache Virtual Environment
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest ruff

    - name: Lint Code with Ruff
      run: |
        ruff check src/ tests/

    - name: Run Pytest Unit & Integration Tests
      run: |
        pytest tests/ -v

    - name: Verify End-to-End Pipeline
      run: |
        python -m src.dataset
        python -m src.features
        python -m src.train
        python -m src.predict
        python -m src.reports

    - name: Build Docker Image (Test)
      run: |
        docker build -t ml-eda-full-fledge .

    - name: Push Docker Image to Docker Hub (Test)
      run: |
        docker push nitins1/ml-eda-full-fledge:latest