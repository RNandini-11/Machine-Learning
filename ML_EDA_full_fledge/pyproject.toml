[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ML_EDA_full_fledge"
version = "0.1.0"
description = "Industry-Grade End-to-End EDA and Feature Selection for Loan Default Prediction"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Data Science Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
    "statsmodels>=0.14.0",
    "scipy>=1.10.0",
    "shap>=0.42.0",
    "joblib>=1.2.0"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W293", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
